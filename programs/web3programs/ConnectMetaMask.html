<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect MetaMask</title>
    <style>
      body {
        max-width: 640px;
        margin: 64px auto;
        padding: 0 24px;
        color: #202124;
        font-family: system-ui, sans-serif;
      }

      button {
        padding: 10px 16px;
        border: 0;
        border-radius: 4px;
        background: #f6851b;
        color: #171717;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      dd {
        overflow-wrap: anywhere;
      }

      #status {
        min-height: 1.5em;
      }
    </style>
  </head>
  <body>
    <h1>Connect MetaMask</h1>
    <p>This page requests your wallet address and network. It does not request a signature or send a transaction.</p>

    <button id="connect-button" type="button">Connect wallet</button>
    <p id="status" role="status" aria-live="polite">Wallet not connected.</p>

    <dl>
      <dt>Account</dt>
      <dd id="account">Not connected</dd>
      <dt>Chain ID</dt>
      <dd id="chain-id">Not connected</dd>
    </dl>

    <script>
      const connectButton = document.getElementById("connect-button");
      const status = document.getElementById("status");
      const accountOutput = document.getElementById("account");
      const chainIdOutput = document.getElementById("chain-id");

      function showConnection(account, chainId) {
        accountOutput.textContent = account ?? "Not connected";
        chainIdOutput.textContent = chainId
          ? `${chainId} (decimal ${Number.parseInt(chainId, 16)})`
          : "Not connected";
        status.textContent = account ? "Wallet connected." : "Wallet disconnected.";
      }

      async function connectWallet() {
        if (!window.ethereum) {
          status.textContent = "MetaMask was not found. Install or enable the browser extension, then reload this page.";
          return;
        }

        connectButton.disabled = true;
        status.textContent = "Waiting for wallet approval...";

        try {
          const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
          const chainId = await window.ethereum.request({ method: "eth_chainId" });
          showConnection(accounts[0], chainId);
        } catch (error) {
          status.textContent = error.code === 4001
            ? "Connection request was rejected in MetaMask."
            : `Could not connect: ${error.message}`;
        } finally {
          connectButton.disabled = false;
        }
      }

      connectButton.addEventListener("click", connectWallet);

      if (window.ethereum) {
        window.ethereum.on("accountsChanged", (accounts) => {
          if (accounts.length === 0) {
            showConnection(null, null);
          } else {
            showConnection(accounts[0], window.ethereum.chainId);
          }
        });

        window.ethereum.on("chainChanged", (chainId) => {
          chainIdOutput.textContent = `${chainId} (decimal ${Number.parseInt(chainId, 16)})`;
        });
      }
    </script>
  </body>
</html>
